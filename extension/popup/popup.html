<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دیجی کالا سرچ خالص</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <!-- هدر -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <svg class="icon-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </div>
        <div>
          <h1 class="title">سرچ خالص دیجی کالا</h1>
          <p class="subtitle">نسخه ۲.۱.۰ • ضد تبلیغ هوشمند</p>
        </div>
      </div>
      <div class="status-indicator" id="status-pill">
        <span class="pulse-dot"></span>
        <span class="status-text" id="status-text">فعال</span>
      </div>
    </header>

    <!-- کارت شمارنده زنده -->
    <div class="stats-card">
      <div class="stats-info">
        <span class="stats-label">تبلیغات مسدود شده در این صفحه</span>
        <strong class="stats-value" id="blocked-count">۰</strong>
      </div>
      <div class="stats-badge">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
    </div>

    <!-- لیست تنظیمات -->
    <div class="toggles-list">
      <!-- گزینه ۱ -->
      <label class="toggle-item" for="toggle-sponsored">
        <div class="toggle-details">
          <div class="toggle-icon-wrap">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
          </div>
          <div class="toggle-text">
            <span class="toggle-title">کالاهای سفارشی و اسپانسری</span>
            <span class="toggle-desc">حذف محصولات پولی با برچسب سفارشی یا آگهی</span>
          </div>
        </div>
        <div class="switch">
          <input type="checkbox" id="toggle-sponsored" checked>
          <span class="slider"></span>
        </div>
      </label>

      <!-- گزینه ۲ -->
      <label class="toggle-item" for="toggle-deals">
        <div class="toggle-details">
          <div class="toggle-icon-wrap">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          </div>
          <div class="toggle-text">
            <span class="toggle-title">شگفت انگیز و فروش ویژه</span>
            <span class="toggle-desc">حذف پیشنهادهای هیجانی و نمایش نتایج عادی</span>
          </div>
        </div>
        <div class="switch">
          <input type="checkbox" id="toggle-deals" checked>
          <span class="slider"></span>
        </div>
      </label>

      <!-- گزینه ۳ -->
      <label class="toggle-item" for="toggle-banners">
        <div class="toggle-details">
          <div class="toggle-icon-wrap">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="9" y1="21" x2="9" y2="9"/>
            </svg>
          </div>
          <div class="toggle-text">
            <span class="toggle-title">بنرها و کاروسل های برندها</span>
            <span class="toggle-desc">پاکسازی اسلایدرهای تبلیغاتی لابلای لیست</span>
          </div>
        </div>
        <div class="switch">
          <input type="checkbox" id="toggle-banners" checked>
          <span class="slider"></span>
        </div>
      </label>
    </div>

    <!-- فوتر -->
    <footer class="footer">
      <span>توسعه یافته توسط <strong>امید ظفری</strong></span>
      <a href="https://github.com/omid-io/digikala-pure-search" target="_blank" class="github-link">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>گیت هاب</span>
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
